name: macos intel

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  TERM: xterm-256color

# save resources, stop outdated workflows
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make:
    runs-on: macos-13 # intel
    steps:
    - name: Install GCC
      run: |
        brew update
        brew install gcc

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Update submodules
      run: 'git submodule update --init --recursive'

    - name: Build
      run: 'CC=gcc make'

    - name: Build Info
      run: 'file ol; make describe'

    - name: Check Reference
      run: CC=gcc make check-reference-native
